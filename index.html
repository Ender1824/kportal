<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src https://api.mcsrvstat.us https://*.kportal.net; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070914">
  <meta name="description" content="Kportal: apps and servers hosted on kportal.net">
  <title>Kportal</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preload" as="image" href="assets/space-mobile.jpg" media="(max-width: 700px)">
  <link rel="preload" as="image" href="assets/space.jpg" media="(min-width: 701px)">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <div class="page">
    <header class="top">
      <a class="brand" href="./" aria-label="Kportal home">
        <img class="brand-logo" src="assets/logo-light.png" width="256" height="256" alt="">
        <span class="brand-name">Kportal</span>
      </a>
      <div class="clock" aria-hidden="true">
        <time class="clock-time" id="clock-time">&nbsp;</time>
        <span class="clock-date" id="clock-date"></span>
      </div>
    </header>

    <main>
      <h1 class="visually-hidden">Kportal apps</h1>

      <ul class="apps" aria-label="Apps">
        <li>
          <a class="tile" href="https://request.kportal.net/" rel="noopener noreferrer" data-ping="https://request.kportal.net/" data-key="1">
            <img class="tile-icon" src="assets/icons/overseerr.svg" width="56" height="56" alt="">
            <span class="tile-name">Request Media</span>
            <span class="status" data-state="checking"><span class="status-dot"></span><span class="status-text">Checking…</span></span>
          </a>
        </li>
        <li>
          <a class="tile" href="https://audiobooks.kportal.net/" rel="noopener noreferrer" data-ping="https://audiobooks.kportal.net/" data-key="2">
            <img class="tile-icon" src="assets/icons/audiobookshelf.svg" width="56" height="56" alt="">
            <span class="tile-name">AudioBooks</span>
            <span class="status" data-state="checking"><span class="status-dot"></span><span class="status-text">Checking…</span></span>
          </a>
        </li>
        <li>
          <a class="tile" href="https://calibreweb.kportal.net/" rel="noopener noreferrer" data-ping="https://calibreweb.kportal.net/" data-key="3">
            <img class="tile-icon" src="assets/icons/kavita.svg" width="56" height="56" alt="">
            <span class="tile-name">Books</span>
            <span class="status" data-state="checking"><span class="status-dot"></span><span class="status-text">Checking…</span></span>
          </a>
        </li>
      </ul>

      <section class="server" aria-labelledby="mc-title">
        <img class="server-icon" src="assets/icons/minecraft.svg" width="56" height="56" alt="">
        <div class="server-info">
          <div class="server-head">
            <h2 class="server-title" id="mc-title">Minecraft</h2>
            <span class="status" id="mc-status" data-state="checking"><span class="status-dot"></span><span class="status-text">Checking…</span></span>
          </div>
          <p class="server-meta"><code class="server-addr" id="mc-addr">mc.kportal.net</code><span class="server-players" id="mc-players"></span></p>
        </div>
        <button class="copy" id="mc-copy" type="button" data-key="4">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span class="copy-label" id="mc-copy-label">Copy address</span>
        </button>
      </section>
    </main>

    <footer class="foot">
      <span>Kportal · <span id="year">2026</span></span>
      <span class="keys">Press <kbd>1</kbd>–<kbd>3</kbd> to open an app, <kbd>4</kbd> to copy the server address</span>
    </footer>
  </div>
</body>
</html>
